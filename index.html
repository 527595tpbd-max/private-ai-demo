<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRIVATE AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1d1135 0%, #090611 55%, #05030a 100%);
      color: #fff;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    .live {
      border: 1px solid #ff4fd8;
      color: #ff6ee4;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
    }
    .panel {
      background: rgba(18, 10, 32, 0.86);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .hint {
      color: #cfc5e6;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.02);
      padding: 14px;
      border-radius: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .tab {
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(90deg, #ff2ea6, #9b5cff);
      border-color: transparent;
    }
    label {
      display: block;
      margin: 14px 0 8px;
      font-size: 14px;
      color: #ddd6f1;
    }
    textarea, select, input[type="text"] {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(5, 4, 14, 0.95);
      color: #fff;
      padding: 16px;
      font-size: 17px;
      outline: none;
    }
    textarea {
      min-height: 128px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 6px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px 16px;
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-top: 18px;
      cursor: pointer;
      background: linear-gradient(90deg, #ff2ea6, #9b5cff);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .upload-box {
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 18px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .thumbs img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #111;
    }
    .results {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 16px;
    }
    .card {
      background: linear-gradient(180deg, rgba(60,20,80,0.35), rgba(20,10,35,0.9));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      padding: 10px;
      min-height: 280px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      border-radius: 16px;
      display: block;
    }
    .msg {
      font-size: 13px;
      color: #e8defc;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .muted {
      color: #a99dc7;
      font-size: 13px;
    }
    .footer-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 18px;
      color: #bdb2d8;
      text-align: center;
      font-size: 14px;
    }
    .footer-nav div.active {
      color: #fff;
    }
    @media (max-width: 640px) {
      .row, .results { grid-template-columns: 1fr; }
      .thumbs { grid-template-columns: repeat(2, 1fr); }
      .btn { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">PRIVATE AI</div>
      <div class="live">LIVE</div>
    </div>

    <div class="panel">
      <div class="hint">
        生成と編集の2モード対応。<br>
        参考画像を1〜3枚まで選んで、文章で「どこを変えるか」を指定できる。
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-create" onclick="switchMode('create')">新規生成</button>
        <button class="tab" id="tab-edit" onclick="switchMode('edit')">参考画像で編集</button>
      </div>

      <div id="create-mode">
        <label>Prompt</label>
        <textarea id="prompt" placeholder="JOLLY ネオンステージ アニメゲームアート"></textarea>

        <div class="row">
          <div>
            <label>Aspect ratio</label>
            <select id="aspect">
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="4:5">4:5</option>
            </select>
          </div>
          <div>
            <label>Style</label>
            <select id="style">
              <option>Anime Game Art</option>
              <option>Cinematic</option>
              <option>Illustration</option>
              <option>Realistic</option>
            </select>
          </div>
        </div>

        <button class="btn" id="create-btn" onclick="generateImages()">画像生成</button>
      </div>

      <div id="edit-mode" style="display:none;">
        <label>編集指示</label>
        <textarea id="editPrompt" placeholder="このキャラをJOLLY風に。白銀髪、黒い×眼帯、ピンク×黒の道化師モチーフ。背景をネオンのショー会場に変更。"></textarea>

        <div class="row">
          <div>
            <label>Aspect ratio</label>
            <select id="editAspect">
              <option value="9:16">9:16</option>
              <option value="1:1">1:1</option>
              <option value="16:9">16:9</option>
              <option value="4:5">4:5</option>
            </select>
          </div>
          <div>
            <label>Style</label>
            <select id="editStyle">
              <option>Anime Game Art</option>
              <option>Cinematic</option>
              <option>Illustration</option>
              <option>Realistic</option>
            </select>
          </div>
        </div>

        <label>参考画像（最大3枚）</label>
        <div class="upload-box">
          <input type="file" id="refImages" accept="image/*" multiple onchange="previewFiles()" />
          <div class="muted">iPhoneの写真から選べる。1〜3枚まで推奨。</div>
          <div class="thumbs" id="thumbs"></div>
        </div>

        <button class="btn" id="edit-btn" onclick="editImages()">画像を編集</button>
      </div>

      <div class="results" id="results"></div>
    </div>

    <div class="footer-nav">
      <div>Chat</div>
      <div class="active">Create</div>
      <div>Characters</div>
      <div>Settings</div>
    </div>
  </div>

  <script>
    let currentMode = 'create';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('create-mode').style.display = mode === 'create' ? 'block' : 'none';
      document.getElementById('edit-mode').style.display = mode === 'edit' ? 'block' : 'none';
      document.getElementById('tab-create').classList.toggle('active', mode === 'create');
      document.getElementById('tab-edit').classList.toggle('active', mode === 'edit');
    }

    function previewFiles() {
      const input = document.getElementById('refImages');
      const thumbs = document.getElementById('thumbs');
      thumbs.innerHTML = '';
      const files = Array.from(input.files || []).slice(0, 3);

      files.forEach(file => {
        const img = document.createElement('img');
        img.src = URL.createObjectURL(file);
        thumbs.appendChild(img);
      });
    }

    function addMessageCard(text) {
      const results = document.getElementById('results');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="msg">${escapeHtml(text)}</div>`;
      results.prepend(card);
    }

    function addImageCard(src, caption = '') {
      const results = document.getElementById('results');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${src}" alt="generated image" />
        ${caption ? `<div class="muted" style="margin-top:8px;">${escapeHtml(caption)}</div>` : ''}
      `;
      results.prepend(card);
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function generateImages() {
      const btn = document.getElementById('create-btn');
      const prompt = document.getElementById('prompt').value.trim();
      const aspect = document.getElementById('aspect').value;
      const style = document.getElementById('style').value;

      if (!prompt) {
        addMessageCard('Promptを入力して。');
        return;
      }

      btn.disabled = true;
      btn.textContent = '生成中...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, aspect, style })
        });

        const data = await res.json();

        if (!res.ok) {
          addMessageCard('失敗\n' + (data.error || JSON.stringify(data)));
          return;
        }

        if (Array.isArray(data.images) && data.images.length) {
          data.images.forEach((img, i) => {
            const src = img.url || img.b64 || img.image || '';
            if (src.startsWith('http')) {
              addImageCard(src, `生成 ${i + 1}`);
            } else if (src) {
              addImageCard(`data:image/png;base64,${src}`, `生成 ${i + 1}`);
            }
          });
        } else {
          addMessageCard('画像レスポンスは返ったけど、表示できる画像形式が見つからんかった。\n' + JSON.stringify(data, null, 2));
        }
      } catch (e) {
        addMessageCard('通信エラー\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '画像生成';
      }
    }

    async function editImages() {
      const btn = document.getElementById('edit-btn');
      const prompt = document.getElementById('editPrompt').value.trim();
      const aspect = document.getElementById('editAspect').value;
      const style = document.getElementById('editStyle').value;
      const files = Array.from(document.getElementById('refImages').files || []).slice(0, 3);

      if (!prompt) {
        addMessageCard('編集指示を入力して。');
        return;
      }
      if (!files.length) {
        addMessageCard('参考画像を1枚以上選んで。');
        return;
      }

      btn.disabled = true;
      btn.textContent = '編集中...';

      try {
        const form = new FormData();
        form.append('prompt', prompt);
        form.append('aspect', aspect);
        form.append('style', style);
        files.forEach(file => form.append('images', file));

        const res = await fetch('/api/edit', {
          method: 'POST',
          body: form
        });

        const data = await res.json();

        if (!res.ok) {
          addMessageCard('失敗\n' + (data.error || JSON.stringify(data)));
          return;
        }

        if (Array.isArray(data.images) && data.images.length) {
          data.images.forEach((img, i) => {
            const src = img.url || img.b64 || img.image || '';
            if (src.startsWith('http')) {
              addImageCard(src, `編集 ${i + 1}`);
            } else if (src) {
              addImageCard(`data:image/png;base64,${src}`, `編集 ${i + 1}`);
            }
          });
        } else {
          addMessageCard('編集レスポンスは返ったけど、表示できる画像形式が見つからんかった。\n' + JSON.stringify(data, null, 2));
        }
      } catch (e) {
        addMessageCard('通信エラー\n' + e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '画像を編集';
      }
    }
  </script>
</body>
</html>
